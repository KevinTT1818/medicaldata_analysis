name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送取消还在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: pip install -r requirements.txt

      # 原始数据不进仓库（29MB，而且是别人的数据）。缓存住，
      # 免得每次都去打 CDC —— 并发下载会被限流，而限流返回的是
      # HTTP 200 的 HTML 错误页，重试多了反而更容易踩到。
      - name: 缓存数据集
        id: data-cache
        uses: actions/cache@v4
        with:
          path: backend/data/raw
          key: raw-${{ hashFiles('backend/scripts/fetch_data.sh') }}

      - name: 下载数据集
        if: steps.data-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: ./scripts/fetch_data.sh

      - name: 跑测试
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: 跑测试
        run: npx ng test --watch=false

      - name: 生产构建
        run: npx ng build

  image:
    name: 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 测试没过就不用浪费时间打镜像
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 只构建不推送 —— 这一步的作用是保证 Dockerfile 没烂掉
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
