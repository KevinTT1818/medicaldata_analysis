services:
  app:
    build: .
    ports:
      # 只绑到本机。要对外提供服务，先设好 MEDDATA_API_KEY 再改这里
      - "127.0.0.1:8000:8000"
    environment:
      # 留空则不校验密钥，并在启动日志里打一条告警。
      # 生成一个：python3 -c 'import secrets;print(secrets.token_urlsafe(32))'
      MEDDATA_API_KEY: "${MEDDATA_API_KEY:-}"
      MEDDATA_LOG_LEVEL: "${MEDDATA_LOG_LEVEL:-INFO}"
    volumes:
      # 原始数据集与 DuckDB 库。容器重建不会丢
      - ./backend/data:/data
    restart: unless-stopped
