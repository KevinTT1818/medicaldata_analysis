@if (required()) {
  <div class="api-key">
    @if (editing()) {
      <label class="field">
        <span class="sr-only">API 密钥</span>
        <input
          type="password"
          autocomplete="off"
          placeholder="粘贴 API 密钥"
          [value]="draft()"
          (input)="draft.set($any($event.target).value)"
          (keydown.enter)="save()"
          (keydown.escape)="cancel()"
        />
      </label>
      <button type="button" class="btn btn-primary btn-sm" (click)="save()">保存</button>
      @if (hasKey()) {
        <button type="button" class="btn btn-sm" (click)="clear()">清除</button>
      }
      <button type="button" class="btn btn-sm" (click)="cancel()">取消</button>
    } @else {
      <button
        type="button"
        class="btn btn-sm"
        [class.is-missing]="missing()"
        (click)="open()"
      >
        {{ missing() ? '需要 API 密钥' : '密钥已设置' }}
      </button>
    }
  </div>
}
